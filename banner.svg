<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Skynexa - Smarter Flights. Simpler Journeys." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d4d">
        <animate attributeName="stop-color" values="#0b1d4d;#1b2f7a;#0b1d4d" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb;#7c3aed;#2563eb" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="280" rx="18"/></clipPath>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="46" ry="14"/>
      <ellipse cx="-24" cy="-8" rx="24" ry="14"/>
      <ellipse cx="14" cy="-12" rx="28" ry="16"/>
    </g>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="280" fill="url(#sky)"/>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle cx="70" cy="40" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="24" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="48" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="26" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="52" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="30" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- drifting clouds -->
    <g fill="#fff" opacity="0.13">
      <g><use href="#cloud"/><animateTransform attributeName="transform" type="translate" from="-120 70" to="1020 70" dur="38s" repeatCount="indefinite"/></g>
      <g><use href="#cloud"/><animateTransform attributeName="transform" type="translate" from="-300 235" to="840 235" dur="30s" repeatCount="indefinite"/></g>
      <g><use href="#cloud"/><animateTransform attributeName="transform" type="translate" from="-500 160" to="640 160" dur="46s" repeatCount="indefinite"/></g>
    </g>

    <!-- flight path (dashes march forward) -->
    <path d="M -40 215 C 180 70 420 240 640 120 S 880 70 960 80" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- plane flying along the path -->
    <g fill="#ffffff">
      <path d="M 24 0 L 8 -4 L 2 -20 L -4 -20 L -2 -4 L -14 -3 L -18 -9 L -22 -9 L -19 0 L -22 9 L -18 9 L -14 3 L -2 4 L -4 20 L 2 20 L 8 4 Z" transform="scale(1.1)"/>
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M -40 215 C 180 70 420 240 640 120 S 880 70 960 80"/>
    </g>

    <!-- title -->
    <text x="450" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="12" fill="#ffffff" opacity="0">
      SKYNEXA
      <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="450" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cfe0ff" opacity="0">
      Smarter Flights. Simpler Journeys.
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.4s" fill="freeze"/>
    </text>

    <!-- rotating feature line -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">
      <text x="450" y="212" opacity="0">Live search  ·  Visual seat maps  ·  Instant refunds
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.33;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="212" opacity="0">Role-based admin consoles  ·  Audit logs
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="212" opacity="0">ACID bookings  ·  Real-time revenue analytics
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.96;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="278" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
</svg>
